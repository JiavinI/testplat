<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TestPlat prototype</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #6d7884;
      --line: #dde3e7;
      --paper: #f7f8f6;
      --panel: #ffffff;
      --navy: #17384b;
      --teal: #1f9d8a;
      --teal-soft: #e5f5f1;
      --amber: #b97822;
      --amber-soft: #fff4df;
      --red: #b95151;
      --red-soft: #fbe9e8;
      --shadow: 0 16px 38px rgba(30, 44, 54, .08);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--paper); }
    button, select, input { font: inherit; }
    button { cursor: pointer; }
    .prototype-mark { position: fixed; z-index: 30; top: 12px; right: 16px; background: #17212b; color: #fff; padding: 5px 9px; border-radius: 4px; font-size: 11px; letter-spacing: .06em; }
    .shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
    .sidebar { background: var(--navy); color: #dce8ec; padding: 26px 15px 20px; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 11px 22px; }
    .brand-mark { width: 30px; height: 30px; border: 2px solid #8ed7c9; border-radius: 9px 9px 9px 2px; display:grid; place-items:center; font-weight: 800; color:#8ed7c9; }
    .brand strong { display:block; font-size: 17px; letter-spacing: .03em; color: #f3faf9; }
    .brand span { display:block; color:#93acb6; font-size:11px; margin-top: 2px; }
    .nav-section { color:#78949e; font-size:10px; letter-spacing:.12em; padding: 0 12px 8px; }
    .project-switch { margin:0 0 23px; padding:11px; border:1px solid #31596a; background:#1d4355; border-radius:5px; }
    .project-switch label { display:block; color:#88a5af; font-size:9px; letter-spacing:.1em; margin-bottom:6px; }
    .project-switch select { width:100%; border:0; color:#f3faf9; background:transparent; font-size:13px; font-weight:650; outline:none; }
    .project-switch small { display:block; margin-top:6px; color:#91abb3; font-size:9px; }
    .nav { display:grid; gap: 4px; }
    .nav button { color:#b9cbd0; background:transparent; border:0; border-radius:5px; padding: 11px 12px; text-align:left; display:flex; gap:11px; align-items:center; font-size:13px; }
    .nav button:hover, .nav button.active { background:#275367; color:#fff; }
    .nav-icon { width:18px; text-align:center; color:#88b9b3; font-size:14px; }
    .side-bottom { margin-top:auto; border-top:1px solid #315463; padding: 15px 10px 0; }
    .user { display:flex; gap:9px; align-items:center; }
    .avatar { width:29px; height:29px; display:grid; place-items:center; background:#d7eee9; color:#1b6f64; border-radius:50%; font-size:12px; font-weight:700; }
    .user b { font-size:12px; font-weight:600; color:#edf7f6; }
    .user small { display:block; color:#89a3ab; font-size:10px; margin-top:2px; }
    .main { min-width:0; }
    .topbar { height:73px; display:flex; align-items:center; justify-content:space-between; padding: 0 38px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.72); }
    .crumbs { color:var(--muted); font-size:12px; }
    .crumbs b { color:var(--ink); font-weight:600; }
    .top-actions { display:flex; align-items:center; gap: 18px; }
    .env-pill { border:1px solid #b8dcd5; background:#f0faf7; color:#147565; padding:7px 11px; border-radius:4px; font-size:12px; display:flex; gap:8px; align-items:center; }
    .dot { width:7px; height:7px; background:#28a78e; border-radius:50%; display:inline-block; }
    .top-link { color:var(--muted); border:0; background:transparent; font-size:12px; }
    .content { padding: 34px 40px 90px; max-width: 1480px; }
    .eyebrow { color:var(--teal); font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
    h1 { font-size:27px; letter-spacing:0; margin:8px 0 6px; line-height:1.2; }
    h2 { font-size:17px; margin:0; }
    .lead { color:var(--muted); font-size:13px; margin:0; line-height:1.7; }
    .section-head { display:flex; justify-content:space-between; align-items:flex-end; margin: 28px 0 14px; }
    .section-head p { color:var(--muted); font-size:12px; margin:3px 0 0; }
    .btn { border:1px solid var(--line); background:#fff; color:var(--ink); padding:9px 13px; border-radius:4px; font-size:12px; display:inline-flex; align-items:center; gap:7px; }
    .btn:hover { border-color:#9bb3ba; background:#fafcfc; }
    .btn.primary { background:var(--teal); border-color:var(--teal); color:white; }
    .btn.primary:hover { background:#188674; }
    .btn.ghost { background:transparent; }
    .btn.icon { width:31px; height:31px; justify-content:center; padding:0; font-size:15px; }
    .hero-grid { display:grid; grid-template-columns: minmax(0, 1.2fr) minmax(300px, .8fr); gap:18px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:6px; box-shadow:0 1px 2px rgba(20,38,45,.02); }
    .panel-pad { padding:20px; }
    .run-card { background:#17384b; color:#fff; min-height:208px; position:relative; overflow:hidden; }
    .run-card:after { content:""; width:280px; height:280px; border:1px solid rgba(142,215,201,.18); border-radius:50%; position:absolute; right:-72px; top:-113px; }
    .run-card .eyebrow { color:#8ed7c9; }
    .run-card h2 { font-size:21px; margin:10px 0 8px; max-width:460px; }
    .run-card p { color:#bad0d5; font-size:12px; line-height:1.6; max-width:480px; }
    .run-card .btn { margin-top:12px; background:#8ed7c9; border-color:#8ed7c9; color:#17384b; font-weight:600; }
    .run-meta { display:flex; gap:25px; margin-top:22px; font-size:11px; color:#aac1c8; }
    .run-meta b { color:#fff; display:block; font-size:14px; margin-bottom:3px; }
    .health { display:grid; gap:0; }
    .health .row { display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); font-size:12px; }
    .health .row:last-child { border-bottom:0; padding-bottom:2px; }
    .status { display:inline-flex; align-items:center; gap:6px; color:#217565; font-size:11px; }
    .status.warn { color:var(--amber); }
    .status.fail { color:var(--red); }
    .status .dot { background:#31a88f; }
    .status.warn .dot { background:#dda54b; }
    .status.fail .dot { background:#cf6d68; }
    .metrics { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin:19px 0 28px; }
    .metric { padding:16px 17px; }
    .metric .label { color:var(--muted); font-size:11px; }
    .metric .value { font-size:25px; font-weight:650; margin:7px 0 3px; letter-spacing:0; }
    .metric .delta { color:#278c7c; font-size:11px; }
    .metric .delta.dim { color:var(--muted); }
    .table { width:100%; border-collapse:collapse; font-size:12px; }
    .table th { color:#859198; text-align:left; font-size:10px; font-weight:600; letter-spacing:.08em; padding:12px 14px; border-bottom:1px solid var(--line); }
    .table td { padding:14px; border-bottom:1px solid #edf0f1; vertical-align:middle; }
    .table tr:last-child td { border-bottom:0; }
    .table tr.clickable:hover { background:#fafcfc; cursor:pointer; }
    .asset-name { display:flex; align-items:center; gap:10px; }
    .asset-mark { width:28px; height:28px; display:grid; place-items:center; border-radius:5px; background:#eaf4f2; color:#218879; font-size:12px; font-weight:700; }
    .asset-name b { font-weight:600; display:block; }
    .asset-name small { color:var(--muted); display:block; margin-top:3px; font-size:10px; }
    .tag { display:inline-block; color:#68777e; background:#f0f3f3; padding:4px 7px; border-radius:3px; font-size:10px; margin:2px 2px 2px 0; }
    .tag.teal { color:#1a786b; background:var(--teal-soft); }
    .tag.amber { color:#9b681e; background:var(--amber-soft); }
    .result { display:inline-flex; align-items:center; gap:6px; padding:5px 8px; border-radius:3px; font-size:10px; }
    .result.pass { background:var(--teal-soft); color:#197666; }
    .result.fail { background:var(--red-soft); color:#a44844; }
    .result.running { background:#e9f0f5; color:#436b80; }
    .result .dot { width:6px; height:6px; }
    .result.fail .dot { background:#c9655e; }
    .result.running .dot { background:#628ca2; }
    .run-layout { display:grid; grid-template-columns: minmax(0, 1.28fr) minmax(295px, .72fr); gap:18px; align-items:start; }
    .filterbar { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
    .filterbar input { flex:1; border:1px solid var(--line); border-radius:4px; padding:9px 11px; background:#fff; font-size:12px; }
    .filterbar select { border:1px solid var(--line); border-radius:4px; padding:9px 10px; color:var(--muted); background:#fff; font-size:12px; }
    .side-stack { display:grid; gap:14px; }
    .panel-title { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line); }
    .panel-title b { font-size:13px; }
    .panel-title span { color:var(--muted); font-size:11px; }
    .kv { display:grid; grid-template-columns: 105px 1fr; row-gap:12px; font-size:11px; padding:17px 18px; }
    .kv label { color:var(--muted); }
    .kv code, code { font-family: "SFMono-Regular", Consolas, monospace; font-size:11px; color:#375361; }
    .timeline { padding:17px 18px 18px; }
    .step { display:grid; grid-template-columns:20px 1fr; gap:11px; position:relative; padding-bottom:18px; }
    .step:last-child { padding-bottom:0; }
    .step:not(:last-child):before { content:""; position:absolute; left:9px; top:20px; height:calc(100% - 14px); border-left:1px solid #cbdedb; }
    .step-no { position:relative; width:19px; height:19px; border-radius:50%; display:grid; place-items:center; font-size:10px; background:#e0f3ee; color:#16816e; font-weight:700; }
    .step-no.fail { background:#fae4e2; color:#b54c48; }
    .step b { font-size:12px; font-weight:600; }
    .step small { display:block; color:var(--muted); font-size:10px; margin-top:4px; }
    .step .result { float:right; margin-top:-2px; }
    .raw-box { background:#f4f7f7; border:1px solid #e4eaea; margin: 0 18px 18px; border-radius:4px; padding:13px; }
    .raw-box pre { white-space:pre-wrap; word-break:break-word; margin:0; color:#385865; font: 10px/1.65 "SFMono-Regular", Consolas, monospace; }
    .raw-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; color:#61747b; font-size:10px; }
    .notice { margin:14px 18px 18px; padding:11px 12px; background:var(--amber-soft); color:#93651f; font-size:11px; line-height:1.55; border-left:3px solid #d8a24c; }
    .modal-backdrop { position:fixed; inset:0; background:rgba(20,35,42,.45); z-index:20; display:none; align-items:center; justify-content:center; }
    .modal-backdrop.show { display:flex; }
    .modal { width:min(760px,calc(100vw - 24px)); max-height:90vh; overflow:auto; background:#fff; border-radius:7px; box-shadow:0 24px 80px rgba(0,0,0,.2); padding:24px; }
    .modal h2 { margin-bottom:7px; }
    .modal p { color:var(--muted); font-size:12px; line-height:1.7; margin:0 0 20px; }
    .modal-section { background:#f7f9f8; border:1px solid #e4eae7; padding:13px; margin-bottom:17px; border-radius:4px; }
    .modal-row { display:flex; justify-content:space-between; font-size:11px; padding:5px 0; }
    .modal-row span:first-child { color:var(--muted); }
    .modal-actions { display:flex; justify-content:flex-end; gap:8px; }
    .toast { position:fixed; right:24px; bottom:24px; z-index:40; background:#17384b; color:#fff; padding:12px 15px; border-radius:5px; font-size:12px; box-shadow:var(--shadow); display:none; }
    .toast.show { display:block; animation: toast 3s both; }
    @keyframes toast { 0%{opacity:0; transform:translateY(8px)} 12%,80%{opacity:1; transform:none} 100%{opacity:0} }
    .asset-content, .table-scroll { min-width:0; overflow-x:auto; }
    .asset-tree { display:grid; align-content:start; gap:4px; border-right:1px solid var(--line); padding-right:14px; }
    .asset-tree b { font-size:12px; margin:5px 10px 12px; }
    .asset-tree button { border:0; background:transparent; padding:9px 10px; text-align:left; border-radius:4px; color:#50636d; display:flex; justify-content:space-between; gap:8px; font-size:12px; }
    .asset-tree button.active, .asset-tree button:hover { background:#e7f3f0; color:#176b5f; }
    .asset-tree small { color:#87969b; }
    .tree-rule { border-top:1px solid var(--line); margin:9px 0; }
    .asset-band { margin:16px 0 30px; }
    .asset-band .table { min-width:680px; }
    .empty-line { border-top:1px solid var(--line); color:var(--muted); font-size:11px; padding:14px 2px; }
    .detail-meta { display:flex; flex-wrap:wrap; gap:10px 22px; border-block:1px solid var(--line); padding:14px 0; margin:20px 0; color:#63737a; font-size:11px; }
    .detail-meta code { margin-left:5px; }
    .detail-row { display:grid; grid-template-columns:24px minmax(0,1fr); gap:12px; padding:17px 0; border-bottom:1px solid var(--line); font-size:12px; }
    .detail-index { display:grid; place-items:center; background:#e7f3ef; color:#187668; border-radius:4px; width:22px; height:22px; font-size:11px; flex:none; }
    .detail-row small { display:block; margin:5px 0; color:var(--muted); }
    .detail-grid { display:grid; grid-template-columns:minmax(0,2fr) minmax(160px,1fr); gap:20px; margin-top:14px; }
    .detail-grid label, .evidence label { color:var(--muted); font-size:11px; }
    .detail-grid pre, .code-block, .evidence pre { background:#f1f5f4; border:1px solid #e3e9e7; padding:12px; border-radius:4px; white-space:pre-wrap; overflow-wrap:anywhere; font:11px/1.6 ui-monospace,monospace; }
    .config-nav { display:flex; flex-wrap:wrap; gap:5px 16px; border-bottom:1px solid var(--line); padding:16px 0; margin-top:12px; }
    .config-nav a { color:#1b786a; text-decoration:none; font-size:12px; padding:5px 0; }
    .config-section { padding:7px 0 17px; border-bottom:1px solid var(--line); }
    .config-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px 24px; }
    .config-list>div { display:flex; justify-content:space-between; gap:12px; border-bottom:1px solid #e9eeed; padding:12px 0; font-size:11px; }
    .config-list code, .config-list span { overflow-wrap:anywhere; }
    .config-list span { color:#65747b; text-align:right; }
    .preview-entries { margin:14px 0; border-top:1px solid var(--line); font-size:12px; }
    .preview-entries>b { display:block; padding:13px 0 7px; }
    .preview-entries>div { border-top:1px solid #e8eeee; padding:10px 0; }
    .preview-entries small { display:block; color:#5e6f75; font:11px/1.6 ui-monospace,monospace; white-space:pre-wrap; overflow-wrap:anywhere; margin-top:4px; }
    .modal-label { font-size:11px; font-weight:600; }
    #runEnvironment { display:block; width:100%; padding:9px; margin:8px 0; border:1px solid var(--line); border-radius:4px; background:#fff; }
    .preview-error { color:#a44844 !important; margin:8px 0 !important; }
    .modal-actions button:disabled { opacity:.45; cursor:not-allowed; }
    .report-layout { margin-top:25px; grid-template-columns:minmax(0,1fr) minmax(330px,1fr); }
    .report-steps { display:grid; gap:4px; margin-top:14px; }
    .report-steps button { border:1px solid var(--line); background:#fff; border-radius:4px; display:flex; gap:12px; align-items:center; width:100%; padding:13px; text-align:left; }
    .report-steps button.active { border-color:#64b9a9; background:#f1f9f6; }
    .report-steps button>span:nth-child(2) { flex:1; min-width:0; }
    .report-steps b, .report-steps small { display:block; font-size:11px; overflow-wrap:anywhere; }
    .report-steps small { color:var(--muted); margin-top:4px; }
    .report-detail .section-head { margin-top:0; align-items:center; gap:10px; }
    .evidence { border-top:1px solid var(--line); padding:13px 0 0; }
    .evidence p, .report-foot { font-size:11px; color:#5a6c72; line-height:1.6; }
    @media (max-width: 1100px) { .shell { grid-template-columns:190px minmax(0,1fr); } .content { padding:26px; } .topbar { padding:0 26px; } .hero-grid,.run-layout { grid-template-columns:1fr; } .metrics { grid-template-columns:repeat(2,1fr); } }
    @media (max-width: 700px) { .shell { display:block; } .sidebar { width:auto; padding:10px; display:block; } .brand,.nav-section,.side-bottom { display:none; } .project-switch { margin:0 0 8px; padding:6px 9px; } .nav { display:flex; overflow-x:auto; } .nav button { flex:none; padding:9px; font-size:11px; } .topbar { height:auto; min-height:52px; padding:10px 15px; gap:8px; flex-wrap:wrap; } .top-actions { gap:10px; } .content { padding:18px 14px 75px; } .asset-workspace { display:block; } .asset-tree { display:flex; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line); padding:0 0 8px; } .asset-tree b,.tree-rule { display:none; } .asset-tree button { flex:none; } .config-list,.detail-grid,.report-layout { grid-template-columns:1fr; } .section-head { gap:12px; flex-wrap:wrap; } .metrics { gap:8px; } .modal { padding:16px; } }
  </style>
</head>
<body>
  <div class="prototype-mark">DESIGN PROTOTYPE · MOCK DATA</div>
  <div id="app"></div>
  <div class="modal-backdrop" id="runModal" aria-hidden="true">
    <div class="modal">
      <h2>运行预览</h2>
      <p>只创建模拟运行。以下请求与步骤按本次项目、资产及环境展示。</p>
      <div id="modalPreview"></div>
      <div class="modal-actions"><button class="btn" data-close-modal>取消</button><button class="btn primary" data-confirm-run>创建运行</button></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
